<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fen Validator</title>
  <link rel="icon" type="image/x-icon" href="/media/icon.png">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #f5f9ff;
      --text: #0f172a;

      --accent: #156082;
      --accent2: #83A4B3;

      --panel: rgba(255, 255, 255, 0.75);
      --border: rgba(15, 23, 42, 0.08);

      --board-light: #C1E4F5;
      --board-dark: #83CAEB;

      --shadow: rgba(15, 23, 42, 0.15);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Aptos Narrow", Arial, sans-serif;
    }

    h1,
    h2,
    h3 {
      font-family: "Baskerville Old Face", Baskerville, serif;
      color: var(--accent);
    }

    /* BOARD */
    #chessCanvas {
      touch-action: none;
      cursor: grab;
      border-radius: 10px;
      box-shadow: 0 25px 180px var(--shadow);
      border: 4px solid var(--accent2);
      width: 100%;
      max-width: 560px;
      height: auto;
    }

    /* PANEL */
    .panel {
      background: var(--panel);
      border-radius: 10px;
      border: 4px solid var(--accent2);
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 40px var(--shadow);
    }

    /* BUTTON */
    .btn {
      background: var(--accent);
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 600;
      border-radius: 4px;
    }

    #fenInput{
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    /* MOBILE IMPROVEMENTS */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      main {
        display: flex !important;
        flex-direction: column;
        gap: 12px;
      }

      #chessCanvas {
        max-width: 100%;
      }

      .panel {
        padding: 12px;
      }
    }
  </style>
</head>

<body class="min-h-screen p-6 flex flex-col items-center">

  <header class="text-center mb-4">
    <h1 class="text-3xl md:text-4xl font-bold">
      FEN Validator & Builder
    </h1>
    <p class="text-slate-500 text-sm">
      Chess position builder & validator
    </p>
  </header>

  <main class="grid grid-cols-1 lg:grid-cols-3 gap-6 w-full max-w-6xl">

    <!-- BOARD -->
    <div class="lg:col-span-2 flex justify-center">
      <canvas id="chessCanvas"></canvas>
    </div>

    <!-- PANEL -->
    <div class="panel p-4 flex flex-col gap-3">
        <div class="text-xs uppercase opacity-60">FEN Code</div>

      <textarea id="fenInput" class="w-full h-20 p-2 rounded font-mono text-xs" placeholder="FEN..."></textarea>

      <button class="btn" onclick="validateFen()">
        Validate via Azure
      </button>

      <div id="validationResult" class="hidden p-3 rounded text-sm whitespace-pre-line border"
        style="border-color: var(--border);">
      </div>

      <div class="border-t pt-3 space-y-1 text-sm" style="border-color: var(--border);">

        <div class="text-xs uppercase opacity-60">Board Info</div>

        <div class="flex justify-between">
          <span>Pieces</span>
          <span id="pieceCount">32</span>
        </div>

        <div class="flex justify-between">
          <span>White</span>
          <span id="whiteCount">16</span>
        </div>

        <div class="flex justify-between">
          <span>Black</span>
          <span id="blackCount">16</span>
        </div>
      </div>

      <button onclick="resetBoard()" class="text-sm underline opacity-60 hover:opacity-100">
        Reset Board
      </button>

    </div>

  </main>

  <script>
    const canvas = document.getElementById("chessCanvas");
    const ctx = canvas.getContext("2d");

    const fenInput = document.getElementById("fenInput");
    const resultBox = document.getElementById("validationResult");

    const pieceCountEl = document.getElementById("pieceCount");
    const whiteCountEl = document.getElementById("whiteCount");
    const blackCountEl = document.getElementById("blackCount");

    let size;
    let board = Array(8).fill(null).map(() => Array(8).fill(null));

    let dragging = null;
    let dragPos = { x: 0, y: 0 };

    /* PIECES */
    const icons = {
      r: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/br.png",
      n: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bn.png",
      b: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bb.png",
      q: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bq.png",
      k: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bk.png",
      p: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bp.png",
      R: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wr.png",
      N: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wn.png",
      B: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wb.png",
      Q: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wq.png",
      K: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wk.png",
      P: "https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wp.png"
    };

    const imgCache = {};
    let ready = false;

    function resizeBoard() {
      size = Math.floor(Math.min(window.innerWidth, 560) / 8);
      canvas.width = size * 8;
      canvas.height = size * 8;
      draw();
    }

    function preload() {
      let keys = Object.keys(icons);
      let loaded = 0;

      keys.forEach(k => {
        const img = new Image();
        img.src = icons[k];
        img.onload = () => {
          loaded++;
          if (loaded === keys.length) {
            ready = true;
            draw();
          }
        };
        imgCache[k] = img;
      });
    }

    function loadFEN(fen) {
      const rows = fen.split(" ")[0].split("/");
      board = Array(8).fill(null).map(() => Array(8).fill(null));

      rows.forEach((row, r) => {
        let c = 0;
        for (let ch of row) {
          if (isNaN(ch)) board[r][c++] = ch;
          else c += parseInt(ch);
        }
      });

      fenInput.value = fen;
      updateStats();
      draw();
    }

    function generateFEN() {
      let fen = "";

      for (let r = 0; r < 8; r++) {
        let empty = 0;
        for (let c = 0; c < 8; c++) {
          if (!board[r][c]) empty++;
          else {
            if (empty) { fen += empty; empty = 0; }
            fen += board[r][c];
          }
        }
        if (empty) fen += empty;
        if (r < 7) fen += "/";
      }

      fenInput.value = `${fen} w - - 0 1`;
      updateStats();
    }

    function draw() {
      if (!ready) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {

          ctx.fillStyle = (r + c) % 2 === 0
            ? getComputedStyle(document.documentElement).getPropertyValue('--board-light')
            : getComputedStyle(document.documentElement).getPropertyValue('--board-dark');

          ctx.fillRect(c * size, r * size, size, size);

          const p = board[r][c];

          if (p && !(dragging && dragging.from.r === r && dragging.from.c === c)) {
            ctx.drawImage(imgCache[p], c * size + size * 0.15, r * size + size * 0.15, size * 0.7, size * 0.7);
          }
        }
      }

      if (dragging) {
        ctx.drawImage(imgCache[dragging.piece], dragPos.x - size / 2, dragPos.y - size / 2, size * 0.7, size * 0.7);
      }
    }

    /* TOUCH + MOUSE DRAG */
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    canvas.addEventListener("mousedown", (e) => {
      const r = Math.floor(e.offsetY / size);
      const c = Math.floor(e.offsetX / size);

      if (board[r][c]) {
        dragging = { piece: board[r][c], from: { r, c } };
        board[r][c] = null;
      }
    });

    canvas.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();

      const r = Math.floor((t.clientY - rect.top) / size);
      const c = Math.floor((t.clientX - rect.left) / size);

      if (board[r][c]) {
        dragging = { piece: board[r][c], from: { r, c } };
        board[r][c] = null;
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      dragPos = getPos(e);
      draw();
    });

    window.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      const t = e.touches[0];
      dragPos = { x: t.clientX, y: t.clientY };
      draw();
    });

    window.addEventListener("mouseup", dropPiece);
    window.addEventListener("touchend", dropPiece);

    function dropPiece(e) {
      if (!dragging) return;

      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || dragPos.x) - rect.left;
      const y = (e.clientY || dragPos.y) - rect.top;

      const r = Math.min(7, Math.max(0, Math.floor(y / size)));
      const c = Math.min(7, Math.max(0, Math.floor(x / size)));

      board[r][c] = dragging.piece;
      dragging = null;

      generateFEN();
      draw();
    }

    /* STATS */
    function updateStats() {
      let white = 0, black = 0, total = 0;

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p) {
            total++;
            if (p === p.toUpperCase()) white++;
            else black++;
          }
        }
      }

      pieceCountEl.textContent = total;
      whiteCountEl.textContent = white;
      blackCountEl.textContent = black;
    }

    /* VALIDATE */
    async function validateFen() {
      resultBox.classList.remove("hidden");
      resultBox.textContent = "Checking...";

      try {
        const res = await fetch(
          "https://fen-validator-func-bafng5cbbpbmakep.germanywestcentral-01.azurewebsites.net/api/ValidateFEN",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fen: fenInput.value.trim() })
          }
        );

        const data = await res.json();

        resultBox.textContent = data.valid
          ? "✅ Valid position"
          : (data.message || "❌ Invalid position");

      } catch (err) {
        resultBox.textContent = "API Error: " + err.message;
      }
    }

    /* RESET */
    function resetBoard() {
      loadFEN("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
    }

    window.addEventListener("resize", resizeBoard);

    preload();
    resizeBoard();
    resetBoard();
  </script>

</body>

</html>
